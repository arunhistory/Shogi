name: wasm-verify
on:
  push:
    paths:
      - 'cpp/**'
      - 'scripts/build-wasm.sh'
      - 'scripts/test-wasm.mjs'
      - 'scripts/test-future-search.mjs'
      - 'scripts/test-forecast-memory.mjs'
      - 'scripts/cpu-latency-smoke.mjs'
      - 'scripts/title-forecast-throughput.mjs'
      - 'scripts/title-gpu-fabric-throughput.mjs'
      - 'src/game/title-gpu-forecast.ts'
      - 'src/game/wasm.ts'
      - 'src/game/position-key.ts'
      - 'src/game/cpu.ts'
      - 'src/game/cpu-worker.ts'
      - 'src/game/cpu-search-worker.ts'
      - 'src/main.ts'
      - '.github/workflows/wasm-verify.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'scripts/build-wasm.sh'
      - 'scripts/test-wasm.mjs'
      - 'scripts/test-future-search.mjs'
      - 'scripts/test-forecast-memory.mjs'
      - 'scripts/cpu-latency-smoke.mjs'
      - 'scripts/title-forecast-throughput.mjs'
      - 'scripts/title-gpu-fabric-throughput.mjs'
      - 'src/game/title-gpu-forecast.ts'
      - 'src/game/wasm.ts'
      - 'src/game/position-key.ts'
      - 'src/game/cpu.ts'
      - 'src/game/cpu-worker.ts'
      - 'src/game/cpu-search-worker.ts'
      - 'src/main.ts'
      - '.github/workflows/wasm-verify.yml'
jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch verified build cache
        run: git fetch origin build-output:refs/remotes/origin/build-output --depth=1 || true
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Verify output
        run: test -s public/wasm/shogi_engine.wasm
      - name: Test WebAssembly runtime
        run: node scripts/test-wasm.mjs
      - name: Test title future-state search
        run: node scripts/test-future-search.mjs
      - name: Test forecast memory assimilation
        run: node scripts/test-forecast-memory.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install application dependencies
        run: npm ci
      - name: Build application with fresh WebAssembly
        run: npm run build
      - name: Verify all CPU reply latencies
        run: node scripts/cpu-latency-smoke.mjs
      - name: Measure actual title forecast throughput
        run: node scripts/title-forecast-throughput.mjs
      - name: Verify 500-layer WebGPU forecast fabric
        run: node scripts/title-gpu-fabric-throughput.mjs
