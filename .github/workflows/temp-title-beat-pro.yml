name: temp-title-beat-pro

on:
  push:
    branches:
      - 'temp/title-beat-pro'
    paths:
      - '.github/workflows/temp-title-beat-pro.yml'

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-beat-pro
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Apply title tempo-discipline A/B patch
        run: node scripts/temp-patch-title-tempo.mjs
      - name: Route title through profile-four parallel engine
        run: node scripts/temp-patch-title-parallel-engine.mjs
      - name: Reserve title reply headroom at 1450ms
        run: node scripts/temp-patch-title-deadline.mjs
      - name: Disable WebGPU for CPU strength isolation
        run: sed -i "s/'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',/'--disable-gpu',/" scripts/title-selfplay-one.mjs
      - name: Build A/B variant
        run: npm run build
      - name: Run title versus pro as gote
        run: node scripts/title-selfplay-one.mjs 2
