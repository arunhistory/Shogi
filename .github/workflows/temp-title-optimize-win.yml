name: temp-title-optimize-win

on:
  push:
    branches:
      - 'temp/title-optimize-win'
    paths:
      - '.github/workflows/temp-title-optimize-win.yml'
      - 'scripts/temp-patch-title-compiler-opt.mjs'
      - 'scripts/temp-patch-title-tempo.mjs'
      - 'scripts/temp-patch-title-parallel-engine.mjs'
      - 'scripts/build-wasm.sh'
      - 'src/game/wasm.ts'
      - 'cpp/**'

permissions:
  contents: read

jobs:
  same-runner-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-optimize-win
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Install application dependencies
        run: npm ci
      - name: Build frozen winning baseline WASM
        run: |
          sh scripts/build-wasm.sh
          BASE_RAW=$(stat -c%s public/wasm/shogi_engine.wasm)
          BASE_GZIP=$(gzip -c public/wasm/shogi_engine.wasm | wc -c)
          echo "BASELINE_RUNTIME_SIZE:{\"wasm\":${BASE_RAW},\"wasmGzip\":${BASE_GZIP}}"
      - name: Apply frozen winning title tempo discipline
        run: node scripts/temp-patch-title-tempo.mjs
      - name: Route frozen winning title through profile-four parallel engine
        run: node scripts/temp-patch-title-parallel-engine.mjs
      - name: Disable WebGPU exactly as winning baseline
        run: sed -i "s/'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',/'--disable-gpu',/" scripts/title-selfplay-one.mjs
      - name: Build frozen winning baseline app
        run: npm run build
      - name: Run frozen winning baseline on this runner
        run: |
          echo 'BASELINE_GAME_START'
          node scripts/title-selfplay-one.mjs 2
          echo 'BASELINE_GAME_END'
      - name: Apply compiler-only optimization
        run: node scripts/temp-patch-title-compiler-opt.mjs
      - name: Build compiler-optimized WASM
        run: |
          sh scripts/build-wasm.sh
          OPT_RAW=$(stat -c%s public/wasm/shogi_engine.wasm)
          OPT_GZIP=$(gzip -c public/wasm/shogi_engine.wasm | wc -c)
          echo "OPTIMIZED_RUNTIME_SIZE:{\"wasm\":${OPT_RAW},\"wasmGzip\":${OPT_GZIP}}"
      - name: Build compiler-optimized app
        run: npm run build
      - name: Run compiler-optimized title on same runner
        run: |
          echo 'OPTIMIZED_GAME_START'
          node scripts/title-selfplay-one.mjs 2
          echo 'OPTIMIZED_GAME_END'
