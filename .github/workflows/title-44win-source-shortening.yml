name: title-44win-source-shortening

on:
  push:
    branches:
      - 'optimize-title-44win-source-shortening'
    paths:
      - '.github/workflows/title-44win-source-shortening.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: optimize-title-44win-source-shortening
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Reconstruct exact 44-ply winning source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-patch-title-eval-snapshot-speed.mjs?ref=4263b01cfd40dfdb95f26b11f5f556757941dc90' > /tmp/title-hotcore.mjs
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-patch-title-incremental-history-hash-v2.mjs?ref=2d15c41db5f7203739a3ebb5ada7873487923545' > /tmp/title-historyhash.mjs
          node /tmp/title-hotcore.mjs
          node /tmp/title-historyhash.mjs
          node scripts/temp-patch-title-dedup2.mjs
          node scripts/temp-patch-title-dedup3.mjs
          node scripts/temp-patch-title-stage-coverage.mjs
          node scripts/temp-patch-title-tempo.mjs
          node scripts/temp-patch-title-parallel-engine.mjs
      - name: Record exact baseline source size
        run: |
          wc -c src/game/cpu.ts src/game/cpu-worker.ts src/game/cpu-search-worker.ts cpp/engine.cpp cpp/engine_history.cpp cpp/engine_parallel.cpp | tee /tmp/source-before.txt
      - name: Build exact baseline
        run: |
          sh scripts/build-wasm.sh
          npm test
          npm run build
          node scripts/test-wasm.mjs
          npm audit --audit-level=high
          sha256sum public/wasm/shogi_engine.wasm > /tmp/wasm-before.sha256
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-before.sha256
          find dist -type f -printf '%P %s\n' | sort > /tmp/dist-size-before.txt
      - name: Shorten representation only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            Path('src/game/cpu.ts'),
            Path('src/game/cpu-worker.ts'),
            Path('src/game/cpu-search-worker.ts'),
            Path('cpp/engine.cpp'),
            Path('cpp/engine_history.cpp'),
            Path('cpp/engine_parallel.cpp'),
          ]
          for path in paths:
            text=path.read_text()
            lines=text.splitlines()
            shortened='\n'.join(line.rstrip() for line in lines if line.strip())+'\n'
            path.write_text(shortened)
          PY
          wc -c src/game/cpu.ts src/game/cpu-worker.ts src/game/cpu-search-worker.ts cpp/engine.cpp cpp/engine_history.cpp cpp/engine_parallel.cpp | tee /tmp/source-after.txt
          echo 'SOURCE_BYTE_DELTA:'
          paste /tmp/source-before.txt /tmp/source-after.txt
      - name: Rebuild shortened source
        run: |
          sh scripts/build-wasm.sh
          npm test
          npm run build
          node scripts/test-wasm.mjs
          npm audit --audit-level=high
          sha256sum public/wasm/shogi_engine.wasm > /tmp/wasm-after.sha256
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-after.sha256
          find dist -type f -printf '%P %s\n' | sort > /tmp/dist-size-after.txt
      - name: Require identical executable output
        run: |
          echo 'WASM:'
          cat /tmp/wasm-before.sha256
          cat /tmp/wasm-after.sha256
          diff -u /tmp/wasm-before.sha256 /tmp/wasm-after.sha256
          echo 'DIST SIZES:'
          diff -u /tmp/dist-size-before.txt /tmp/dist-size-after.txt || true
          echo 'DIST HASHES:'
          diff -u /tmp/dist-before.sha256 /tmp/dist-after.sha256
          echo 'PURE_SHORTENING_EXECUTABLE_OUTPUT_IDENTICAL:true'
