name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install Cloudflare toolchain
        working-directory: cloudflare
        run: npm install
      - name: Verify Cloudflare Worker
        working-directory: cloudflare
        run: npm run check
      - name: Build Cloudflare deployment bundle
        working-directory: cloudflare
        run: npm run build
      - name: Stage Cloudflare deployment bundle
        run: |
          mkdir -p public/deploy
          cp cloudflare/dist/index-v2.js public/deploy/shogi-system.js
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Browser smoke test
        run: npm run test:browser
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5