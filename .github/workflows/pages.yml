name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch verified build cache
        run: git fetch origin build-output:refs/remotes/origin/build-output --depth=1 || true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install locked Cloudflare toolchain
        working-directory: cloudflare
        run: npm ci
      - name: Audit Cloudflare dependencies
        working-directory: cloudflare
        run: npm audit --audit-level=high
      - name: Verify Cloudflare Worker
        working-directory: cloudflare
        run: npm run check
      - name: Build Cloudflare deployment bundle
        working-directory: cloudflare
        run: npm run build
      - name: Stage Cloudflare deployment modules
        run: node cloudflare/scripts/stage-deploy.mjs
      - name: Verify staged Cloudflare manifest
        run: |
          test -s public/deploy/manifest.json
          test -s public/deploy/index-v2.js
          test "$(find public/deploy -maxdepth 1 -type f -name '*-shogi_engine.wasm' | wc -l)" -eq 1
      - name: Install locked application dependencies
        run: npm ci
      - name: Audit application dependencies
        run: npm audit --audit-level=high
      - run: npm test
      - name: Build production app
        env:
          VITE_SHOGI_API_URL: https://shogi-system.garigarimegane625.workers.dev
          VITE_TITLE_SUPABASE_URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          VITE_TITLE_SUPABASE_KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: npm run build
      - name: Verify packaged BGM
        run: |
          test -s dist/assets/audio/maou_bgm_8bit26.ogg
          test "$(stat -c '%s' dist/assets/audio/maou_bgm_8bit26.ogg)" -eq 6838254
          echo '4d9eb71e46b77b58854360bc8d6c46eb5a98a90be0fcd4039dea8934e60d7cb2  dist/assets/audio/maou_bgm_8bit26.ogg' | sha256sum -c -
      - name: Browser smoke test
        run: npm run test:browser
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
