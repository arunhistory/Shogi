name: title-44win-jobid

on:
  push:
    branches:
      - 'optimize-title-44win-jobid'
    paths:
      - '.github/workflows/title-44win-jobid.yml'
      - 'scripts/temp-patch-title-jobid-counter.mjs'

permissions:
  contents: read
  actions: read

jobs:
  verify-and-live:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: optimize-title-44win-jobid
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Install dependencies and fetch proven helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-patch-title-eval-snapshot-speed.mjs?ref=optimize-title-82win-eval' > /tmp/title-hotcore.mjs
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/title-pro-acceptance-one.mjs?ref=optimize-title-pressure-order' > /tmp/title-pro-acceptance-one.mjs
      - name: Build accumulated same-logic Title
        run: |
          node /tmp/title-hotcore.mjs
          node scripts/temp-patch-title-incremental-history-hash-v2.mjs
          node scripts/temp-patch-title-qdedup-lanekey.mjs
          node scripts/temp-patch-title-historykey-reuse.mjs
          node scripts/temp-patch-title-dual-history-key.mjs
          node scripts/temp-patch-title-known-check-history.mjs
          sh scripts/build-wasm.sh
          node scripts/temp-patch-title-dedup2.mjs
          node scripts/temp-patch-title-dedup3.mjs
          node scripts/temp-patch-title-stage-coverage.mjs
          node scripts/temp-patch-title-root-precompute.mjs
          node scripts/temp-patch-title-root-move-map.mjs
          node scripts/temp-patch-title-jobid-counter.mjs
          node scripts/temp-patch-title-tempo.mjs
          node scripts/temp-patch-title-parallel-engine.mjs
      - name: Verify unchanged contracts
        run: |
          npm test
          npm run build
          node scripts/test-wasm.mjs
          npm audit --audit-level=high
          grep -F 'replyDeadlineMs:1650' src/game/cpu.ts
          grep -F 'logicalJobTarget:455' src/game/cpu.ts
          grep -F "jobId:level==='title'?" src/game/cpu-worker.ts
          grep -F 'crypto.randomUUID()' src/game/cpu-worker.ts
      - name: Run isolated Pro-sente versus Title-gote match
        run: node /tmp/title-pro-acceptance-one.mjs '${{ matrix.trial }}' 'jobid' | tee /tmp/title-acceptance.log
      - name: Report fixed acceptance criteria
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          let text='';
          try{text=await readFile('/tmp/title-acceptance.log','utf8')}catch{}
          const line=text.split(/\r?\n/).find(value=>value.startsWith('TITLE_ACCEPTANCE_RESULT:'));
          if(!line){console.log('TITLE_JOBID_ACCEPTANCE:MISSING');process.exit(1)}
          const result=JSON.parse(line.slice('TITLE_ACCEPTANCE_RESULT:'.length));
          console.log(`TITLE_JOBID_ACCEPTANCE:${JSON.stringify({trial:result.trial,result:result.result,plies:result.plies,titleAvgReplyMs:result.titleAvgReplyMs,titleMaxReplyMs:result.titleMaxReplyMs,speedImproved:result.speedImproved,pass82:result.pass82,goal30:result.goal30,titleNodes:result.titleNodes,titleJobs:result.titleJobs})}`);
          if(!result.pass82)process.exit(1);
          JS
