name: title-44win-wasm-metadata-shortening

on:
  push:
    branches:
      - 'optimize-title-44win-source-shortening'
    paths:
      - '.github/workflows/title-44win-wasm-metadata-shortening.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: optimize-title-44win-source-shortening
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Reconstruct exact 44-ply winning WASM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-patch-title-eval-snapshot-speed.mjs?ref=4263b01cfd40dfdb95f26b11f5f556757941dc90' > /tmp/title-hotcore.mjs
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-patch-title-incremental-history-hash-v2.mjs?ref=2d15c41db5f7203739a3ebb5ada7873487923545' > /tmp/title-historyhash.mjs
          node /tmp/title-hotcore.mjs
          node /tmp/title-historyhash.mjs
          sh scripts/build-wasm.sh
          cp public/wasm/shogi_engine.wasm /tmp/shogi-before.wasm
          node scripts/test-wasm.mjs
      - name: Strip only known non-executable custom metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src=Path('/tmp/shogi-before.wasm').read_bytes()
          if src[:4] != b'\0asm' or src[4:8] != b'\x01\0\0\0':
              raise SystemExit('BAD_WASM_HEADER')

          def read_u32(data, pos):
              value=0; shift=0; start=pos
              while True:
                  if pos>=len(data): raise ValueError('TRUNCATED_LEB')
                  b=data[pos]; pos+=1
                  value |= (b & 0x7f) << shift
                  if not (b & 0x80): return value,pos
                  shift += 7
                  if shift>35: raise ValueError('BAD_LEB')

          def custom_name(payload):
              try:
                  n,p=read_u32(payload,0)
                  return payload[p:p+n].decode('utf-8','strict')
              except Exception:
                  return '<invalid>'

          sections=[]; pos=8
          while pos<len(src):
              start=pos
              sid=src[pos]; pos+=1
              size,payload_start=read_u32(src,pos)
              payload_end=payload_start+size
              if payload_end>len(src): raise SystemExit('TRUNCATED_SECTION')
              raw=src[start:payload_end]
              payload=src[payload_start:payload_end]
              name=custom_name(payload) if sid==0 else ''
              sections.append((sid,name,raw))
              pos=payload_end

          print('WASM_BEFORE_BYTES',len(src))
          for sid,name,raw in sections:
              if sid==0: print(f'CUSTOM_SECTION:{name}:{len(raw)}')

          safe_names={'name','producers','sourceMappingURL','external_debug_info'}
          def safe_custom(name):
              return name in safe_names or name.startswith('.debug_')

          removed=[]
          out=bytearray(src[:8])
          before_noncustom=[]; after_noncustom=[]
          for sid,name,raw in sections:
              if sid==0 and safe_custom(name):
                  removed.append((name,len(raw)))
                  continue
              out.extend(raw)
              if sid!=0: after_noncustom.append(raw)
              if sid!=0: before_noncustom.append(raw)

          out=bytes(out)
          Path('/tmp/shogi-after.wasm').write_bytes(out)
          print('WASM_AFTER_BYTES',len(out))
          print('WASM_BYTES_SAVED',len(src)-len(out))
          for name,size in removed: print(f'REMOVED_CUSTOM_SECTION:{name}:{size}')
          if not removed: print('NO_SAFE_CUSTOM_SECTIONS_REMOVED')
          if before_noncustom != after_noncustom: raise SystemExit('NONCUSTOM_SECTION_BYTES_CHANGED')
          print('NONCUSTOM_SECTION_BYTES_IDENTICAL:true')
          print('BEFORE_SHA256',hashlib.sha256(src).hexdigest())
          print('AFTER_SHA256',hashlib.sha256(out).hexdigest())
          PY
          cp /tmp/shogi-after.wasm public/wasm/shogi_engine.wasm
      - name: Verify stripped WASM behavior
        run: |
          node scripts/test-wasm.mjs
          npm test
          npm audit --audit-level=high
