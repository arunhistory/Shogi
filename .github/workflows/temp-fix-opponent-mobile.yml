name: temp-fix-opponent-mobile
on:
  push:
    branches: [main]
    paths: ['.opponent-mobile-trigger']
permissions:
  contents: write
jobs:
  verify-mobile-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Patch mobile visual only
        run: node scripts/temp-fix-opponent-mobile.mjs
      - name: Verify patch scope and distinct markers
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/style.css"
          grep -q 'cell.opponent-move-from{box-shadow:inset 0 0 0 4px rgba(43,92,170,.88)}' src/style.css
          grep -q 'cell.opponent-move-to{box-shadow:inset 0 0 0 4px rgba(241,205,72,.94)}' src/style.css
          ! grep -q 'opponent-move-from,.cell.opponent-move-to{box-shadow:inset 0 0 0 4px currentColor}' src/style.css
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          VITE_SHOGI_API_URL: https://shogi-system.garigarimegane625.workers.dev
          VITE_TITLE_SUPABASE_URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          VITE_TITLE_SUPABASE_KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: npm run build
      - name: Browser smoke
        run: npm run test:browser
      - name: Commit verified mobile visual fix
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'arunhistory'
          git config user.email 'garigarimegane625@gmail.com'
          git add src/style.css
          git commit -m 'fix: preserve opponent move colors on mobile'
          git push origin HEAD:main
