name: generate-lockfiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfiles.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate root lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Generate Cloudflare lockfile without install scripts
        working-directory: cloudflare
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit Cloudflare dependencies
        working-directory: cloudflare
        run: npm audit --audit-level=high
      - name: Commit reproducible lockfiles
        run: |
          test -s package-lock.json
          test -s cloudflare/package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json cloudflare/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git commit -m 'Lock application and Cloudflare dependencies'
          git push origin HEAD:main
