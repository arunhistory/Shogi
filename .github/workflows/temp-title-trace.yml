name: temp-title-vs-pro-broad-first

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-trace.yml'

permissions:
  contents: read

jobs:
  broad-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Isolate CPU and apply broad-first title search
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/title-selfplay-one.mjs')
          s=p.read_text()
          old="'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',"
          if old not in s:
              raise SystemExit('GPU_FLAGS_NOT_FOUND')
          p.write_text(s.replace(old,"'--disable-gpu',",1))

          p=Path('src/game/cpu-worker.ts')
          s=p.read_text()
          replacements=[
            (
              "  if(stage<2)return ranked.map(item=>item.move);",
              "  if(stage===0)return ranked.slice(0,Math.min(ranked.length,16)).map(item=>item.move);\n  if(stage===1)return ranked.slice(0,Math.min(ranked.length,8)).map(item=>item.move);"
            ),
            (
              "  const desired=[2,3,4,6,8,12][Math.min(stage,5)]??12;",
              "  const desired=[1,1,2,4,6,8][Math.min(stage,5)]??8;"
            ),
            (
              "    const depth=Math.min(profile.maxDepth,profile.baseDepth+stage*profile.depthStep);",
              "    const depth=level==='title'?Math.min(profile.maxDepth,1+stage*2):Math.min(profile.maxDepth,profile.baseDepth+stage*profile.depthStep);"
            ),
            (
              "    const nodeLimit=Math.min(220_000,Math.trunc(profile.nodeBase*Math.pow(growth,stage)));",
              "    const nodeLimit=level==='title'&&stage===0?1200:Math.min(220_000,Math.trunc(profile.nodeBase*Math.pow(growth,stage)));"
            ),
            (
              "    const completed=await runStage(slots,jobs,deadline,profile.jobTimeoutMs);",
              "    const stageJobTimeout=level==='title'&&stage===0?90:profile.jobTimeoutMs;\n    const completed=await runStage(slots,jobs,deadline,stageJobTimeout);"
            ),
            (
              "    const ranked=rankStageResults(survivors,completed,level);\n    if(ranked.length){",
              "    const ranked=rankStageResults(survivors,completed,level);\n    if(level==='title'&&ranked.length!==survivors.length)break;\n    if(ranked.length){"
            ),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('PATCH_ANCHOR_NOT_FOUND:'+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build A/B variant
        run: npm run build
      - name: Run broad-first title versus pro as gote
        run: node scripts/title-selfplay-one.mjs 2
