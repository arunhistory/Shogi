name: temp-title-vs-pro-fair-stage

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-trace.yml'

permissions:
  contents: read

jobs:
  fair-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Isolate CPU and reject partial title stages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/title-selfplay-one.mjs')
          s=p.read_text()
          old="'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',"
          if old not in s:
              raise SystemExit('GPU_FLAGS_NOT_FOUND')
          p.write_text(s.replace(old,"'--disable-gpu',",1))

          p=Path('src/game/cpu-worker.ts')
          s=p.read_text()
          old="    const ranked=rankStageResults(survivors,completed,level);\n    if(ranked.length){"
          new="    const ranked=rankStageResults(survivors,completed,level);\n    if(level==='title'&&ranked.length!==survivors.length)break;\n    if(ranked.length){"
          if old not in s:
              raise SystemExit('TITLE_STAGE_RANK_ANCHOR_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build A/B variant
        run: npm run build
      - name: Run fair-stage title versus pro as gote
        run: node scripts/title-selfplay-one.mjs 2
