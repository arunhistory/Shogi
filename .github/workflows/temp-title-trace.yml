name: temp-title-vs-pro-integrated-root

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-trace.yml'

permissions:
  contents: read

jobs:
  integrated-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Patch runner to use integrated title root search
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/title-selfplay-one.mjs')
          s=p.read_text()

          gpu="'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',"
          if gpu not in s:
              raise SystemExit('GPU_FLAGS_NOT_FOUND')
          s=s.replace(gpu,"'--disable-gpu',",1)

          import_anchor="    const engine=await import('/src/game/engine.ts');\n    const wasmUrl=new URL('/wasm/shogi_engine.wasm',location.origin).toString();"
          import_replacement="    const engine=await import('/src/game/engine.ts');\n    const wasmModule=await import('/src/game/wasm.ts');\n    const wasmUrl=new URL('/wasm/shogi_engine.wasm',location.origin).toString();\n    const integratedTitle=await wasmModule.loadWasmShogiEngine(wasmUrl);\n    if(!integratedTitle)throw new Error('INTEGRATED_TITLE_WASM_UNAVAILABLE');"
          if import_anchor not in s:
              raise SystemExit('WASM_IMPORT_ANCHOR_NOT_FOUND')
          s=s.replace(import_anchor,import_replacement,1)

          search_anchor="    const search=(worker,level,pos)=>new Promise((resolve,reject)=>{"
          if search_anchor not in s:
              raise SystemExit('SEARCH_ANCHOR_NOT_FOUND')
          s=s.replace(search_anchor,"    const workerSearch=(worker,level,pos)=>new Promise((resolve,reject)=>{",1)

          warmup_anchor="    titleWorker.postMessage({type:'warmup',position,level:'title',wasmUrl});"
          wrapper="""    const search=async(worker,level,pos)=>{\n      if(level==='title'){\n        const started=performance.now();\n        const direct=integratedTitle.searchBestMove(pos,12,1000000);\n        if(!direct.move)throw new Error('INTEGRATED_TITLE_NO_MOVE');\n        return{\n          result:{\n            move:direct.move,nodesVisited:Number(direct.nodesVisited??0),\n            logicalJobsCompleted:1,completedDepth:0,\n            gpuForecastUsed:false,gpuForecastSamples:0,gpuForecastLayers:0,gpuForecastMs:0,\n          },\n          elapsedMs:performance.now()-started,\n        };\n      }\n      return workerSearch(worker,level,pos);\n    };\n    // Integrated title search owns its WASM instance and needs no title worker warmup."""
          if warmup_anchor not in s:
              raise SystemExit('TITLE_WARMUP_ANCHOR_NOT_FOUND')
          s=s.replace(warmup_anchor,wrapper,1)
          p.write_text(s)
          PY
      - name: Build A/B variant
        run: npm run build
      - name: Run integrated title versus pro as gote
        run: node scripts/title-selfplay-one.mjs 2
