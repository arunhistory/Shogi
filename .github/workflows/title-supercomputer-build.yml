name: title-supercomputer-build

on:
  push:
    branches:
      - 'experiment/title-supercomputer-v1'
    paths:
      - 'cpp/title_supercomputer.cpp'
      - 'scripts/temp-patch-title-super-fastpath.mjs'
      - 'scripts/temp-patch-title-super-metrics.mjs'
      - 'scripts/temp-patch-title-super-inplace.mjs'
      - 'scripts/temp-patch-title-super-state-cache.mjs'
      - 'scripts/test-title-super-inplace.mjs'
      - 'scripts/title-supercomputer-local-bench.mjs'
      - '.github/workflows/title-supercomputer-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/title-supercomputer-v1
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten wabt binaryen
      - name: Apply reproducible SuperTitle fastpath
        run: node scripts/temp-patch-title-super-fastpath.mjs cpp/title_supercomputer.cpp /tmp/title_supercomputer_fast.cpp
      - name: Remove duplicate SuperTitle metric scans
        run: node scripts/temp-patch-title-super-metrics.mjs /tmp/title_supercomputer_fast.cpp /tmp/title_supercomputer_metrics.cpp
      - name: Replace child copies with make-unmake
        run: node scripts/temp-patch-title-super-inplace.mjs /tmp/title_supercomputer_metrics.cpp /tmp/title_supercomputer_inplace.cpp
      - name: Add incremental search state cache candidate
        run: |
          node scripts/temp-patch-title-super-state-cache.mjs /tmp/title_supercomputer_inplace.cpp /tmp/title_supercomputer_cached.cpp
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/title_supercomputer_cached.cpp')
          text=path.read_text()
          anchor='struct SuperUndo{'
          decl='int super_base_eval(const Position&pos,int perspective);\ninline void super_mark(uint8_t*map,int y,int x);\nvoid super_slide_map(const Position&pos,uint8_t*map,int y,int x,int dy,int dx);\n'
          if anchor not in text:
              raise SystemExit('CACHE_FORWARD_DECL_ANCHOR_MISSING')
          path.write_text(text.replace(anchor,decl+anchor,1))
          PY
      - name: Build metrics inplace and cached WASM variants
        run: |
          mkdir -p public/wasm
          COMMON_FLAGS=(
            -Icpp -O3 -std=c++17 -include initializer_list
            -s WASM=1 -s STANDALONE_WASM=1 --no-entry
            -Wl,--export=shogi_input_buffer
            -Wl,--export=shogi_input_capacity
            -Wl,--export=shogi_legal_move_count
            -Wl,--export=shogi_legal_move_at
            -Wl,--export=shogi_is_check
            -Wl,--export=shogi_is_mate
            -Wl,--export=shogi_super_search_specialist
            -Wl,--export=shogi_super_converge
            -Wl,--export=shogi_super_best_score
            -Wl,--export=shogi_super_nodes_searched
          )
          em++ /tmp/title_supercomputer_metrics.cpp "${COMMON_FLAGS[@]}" -o /tmp/title_supercomputer_metrics_raw.wasm
          wasm-opt -O4 /tmp/title_supercomputer_metrics_raw.wasm -o /tmp/title_supercomputer_metrics.wasm
          em++ /tmp/title_supercomputer_inplace.cpp "${COMMON_FLAGS[@]}" -Wl,--export=shogi_super_inplace_selftest -o /tmp/title_supercomputer_inplace_raw.wasm
          wasm-opt -O4 /tmp/title_supercomputer_inplace_raw.wasm -o public/wasm/title_supercomputer.wasm
          em++ /tmp/title_supercomputer_cached.cpp "${COMMON_FLAGS[@]}" -Wl,--export=shogi_super_inplace_selftest -o /tmp/title_supercomputer_cached_raw.wasm
          wasm-opt -O4 /tmp/title_supercomputer_cached_raw.wasm -o /tmp/title_supercomputer_cached.wasm
          wasm-validate /tmp/title_supercomputer_metrics.wasm
          wasm-validate public/wasm/title_supercomputer.wasm
          wasm-validate /tmp/title_supercomputer_cached.wasm
          ls -lh /tmp/title_supercomputer_metrics.wasm public/wasm/title_supercomputer.wasm /tmp/title_supercomputer_cached.wasm
          sha256sum /tmp/title_supercomputer_metrics.wasm public/wasm/title_supercomputer.wasm /tmp/title_supercomputer_cached.wasm
      - name: Compare exact 5M search performance
        run: node scripts/title-supercomputer-local-bench.mjs /tmp/title_supercomputer_metrics.wasm public/wasm/title_supercomputer.wasm /tmp/title_supercomputer_cached.wasm
      - name: Verify current required exports and state roundtrip
        run: |
          wasm-objdump -x public/wasm/title_supercomputer.wasm | tee /tmp/exports.txt
          grep -q 'shogi_super_search_specialist' /tmp/exports.txt
          grep -q 'shogi_super_converge' /tmp/exports.txt
          grep -q 'shogi_input_buffer' /tmp/exports.txt
          grep -q 'shogi_super_inplace_selftest' /tmp/exports.txt
          node scripts/test-title-super-inplace.mjs
      - name: Commit current generated WASM to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/wasm/title_supercomputer.wasm
          if git diff --cached --quiet; then
            echo 'WASM unchanged'
            exit 0
          fi
          git commit -m 'build: add experimental Title supercomputer wasm'
          git push origin HEAD:experiment/title-supercomputer-v1