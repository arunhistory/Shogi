name: temp-connect-title-ui
on:
  push:
    branches: [main]
    paths: ['.title-ui-connect-trigger']
permissions:
  contents: read
jobs:
  title-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build production UI with Title endpoint
        env:
          VITE_SHOGI_API_URL: https://shogi-system.garigarimegane625.workers.dev
          VITE_TITLE_SUPABASE_URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          VITE_TITLE_SUPABASE_KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: npm run build
      - name: Run Title UI authoritative round-trip
        run: node scripts/temp-title-ui-e2e.mjs
