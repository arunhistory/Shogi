name: temp-connect-title-ui
on:
  push:
    branches: [main]
    paths: ['.title-ui-connect-trigger']
permissions:
  contents: write
jobs:
  opponent-action-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Patch opponent action visual only
        run: node scripts/temp-opponent-action-patch.mjs
      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/main.ts src/style.css "
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          VITE_SHOGI_API_URL: https://shogi-system.garigarimegane625.workers.dev
          VITE_TITLE_SUPABASE_URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          VITE_TITLE_SUPABASE_KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: npm run build
      - name: Existing browser smoke
        run: npm run test:browser
      - name: Opponent action visual smoke
        run: node scripts/temp-title-ui-e2e.mjs
      - name: Commit verified UI files only
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'arunhistory'
          git config user.email 'garigarimegane625@gmail.com'
          git add src/main.ts src/style.css
          git commit -m 'fix: show opponent move visually on board'
          git push origin HEAD:main
