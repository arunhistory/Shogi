name: title-history-hash-opt

on:
  push:
    branches:
      - 'optimize-title-82win-history-hash'
    paths:
      - '.github/workflows/title-history-hash-opt.yml'
      - 'scripts/temp-patch-title-incremental-history-hash-v2.mjs'

permissions:
  contents: read
  actions: read

jobs:
  verify-history-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: optimize-title-82win-history-hash
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Install dependencies and recover exact benchmark helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-patch-title-eval-snapshot-speed.mjs?ref=optimize-title-82win-eval' > /tmp/title-hotcore.mjs
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/temp-title-parallel-equivalence.mjs?ref=optimize-title-82win-eval' > /tmp/title-equivalence.mjs
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/arunhistory/Shogi/contents/scripts/title-82-trace-bench.mjs?ref=optimize-title-82trace-dedup2' > /tmp/title-82-trace-bench.mjs
      - name: Build current stable Title baseline
        run: |
          node /tmp/title-hotcore.mjs
          sh scripts/build-wasm.sh
          cp public/wasm/shogi_engine.wasm /tmp/title-baseline.wasm
          node /tmp/title-equivalence.mjs /tmp/title-baseline.wasm /tmp/title-baseline.json
      - name: Apply Title-only incremental history hash
        run: node scripts/temp-patch-title-incremental-history-hash-v2.mjs
      - name: Build incremental-hash engine
        run: |
          sh scripts/build-wasm.sh
          node /tmp/title-equivalence.mjs public/wasm/shogi_engine.wasm /tmp/title-historyhash.json
      - name: Require exact search semantics
        run: |
          diff -u /tmp/title-baseline.json /tmp/title-historyhash.json
          echo 'TITLE_HISTORY_HASH_EQUIVALENCE:PASS'
      - name: Apply stable TypeScript Title path
        run: |
          node scripts/temp-patch-title-dedup2.mjs
          node scripts/temp-patch-title-dedup3.mjs
          node scripts/temp-patch-title-stage-coverage.mjs
          node scripts/temp-patch-title-tempo.mjs
          node scripts/temp-patch-title-parallel-engine.mjs
      - name: Verify application
        run: |
          npm test
          npm run build
          node scripts/test-wasm.mjs
          npm audit --audit-level=high
      - name: Recover canonical winning trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/arunhistory/Shogi/actions/jobs/99261766337/logs > /tmp/title-82-winning.log
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const text=await readFile('/tmp/title-82-winning.log','utf8');
          const line=text.split(/\r?\n/).find(value=>value.includes('SELFPLAY_RESULT:')&&value.includes('"result":"title-win"')&&value.includes('"plies":82'));
          if(!line)throw new Error('CANONICAL_82_WIN_RESULT_NOT_FOUND');
          const marker='SELFPLAY_RESULT:';
          const result=JSON.parse(line.slice(line.indexOf(marker)+marker.length));
          if(result.result!=='title-win'||result.plies!==82||result.titleSide!=='gote'||result.proSide!=='sente'||result.moveTrace?.length!==82)throw new Error('CANONICAL_82_WIN_INVALID');
          await writeFile('/tmp/title-82-winning.json',JSON.stringify(result));
          JS
      - name: Run winning-route regression benchmark
        run: node /tmp/title-82-trace-bench.mjs /tmp/title-82-winning.json | tee /tmp/title-historyhash-trace.log
      - name: Require all 41 Title decisions preserved and speed under pass limit
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const text=await readFile('/tmp/title-historyhash-trace.log','utf8');
          const line=text.split(/\r?\n/).find(value=>value.startsWith('TITLE_TRACE_RESULT:'));
          if(!line)throw new Error('TITLE_TRACE_RESULT_MISSING');
          const result=JSON.parse(line.slice('TITLE_TRACE_RESULT:'.length));
          const summary={fullMatch:result.fullMatch,matchedTitleMoves:result.matchedTitleMoves,totalTitleMoves:result.totalTitleMoves,maxMs:result.maxMs,avgMs:result.avgMs,firstMismatch:result.firstMismatch};
          console.log(`TITLE_HISTORY_HASH_SUMMARY:${JSON.stringify(summary)}`);
          if(!result.fullMatch||result.matchedTitleMoves!==41||result.totalTitleMoves!==41||result.maxMs>=2600)process.exit(1);
          JS
