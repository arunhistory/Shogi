name: temp-title-complex-selfplay

on:
  push:
    branches:
      - 'temp/title-complex-search'
    paths:
      - '.github/workflows/temp-title-complex-selfplay.yml'

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Run title vs pro game
        run: node scripts/title-selfplay-one.mjs ${{ matrix.game }}
