name: cloudflare-verify
on:
  push:
    paths:
      - 'cloudflare/**'
      - 'cpp/**'
      - 'scripts/build-wasm.sh'
      - 'src/game/**'
      - '.github/workflows/cloudflare-verify.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'cpp/**'
      - 'scripts/build-wasm.sh'
      - 'src/game/**'
      - '.github/workflows/cloudflare-verify.yml'
jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build shared C++ WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install pinned Cloudflare toolchain
        working-directory: cloudflare
        run: npm install
      - name: Type check Worker and shared shogi engine
        working-directory: cloudflare
        run: npm run check
      - name: Bundle Worker without deployment
        working-directory: cloudflare
        run: npm run build
      - name: Verify compiled Wasm is present in dry-run artifact
        run: |
          test -s cloudflare/src/shogi_engine.wasm
          find cloudflare/dist -type f -maxdepth 2 -print
      - name: Run local Durable Objects E2E
        working-directory: cloudflare
        run: |
          set -euo pipefail
          npx wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/shogi-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shogi-wrangler.log
            exit 1
          fi
          npm run e2e || {
            cat /tmp/shogi-wrangler.log
            exit 1
          }
      - name: Preserve verified deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: shogi-cloudflare-bundle
          path: cloudflare/dist/
          if-no-files-found: error
          retention-days: 1
