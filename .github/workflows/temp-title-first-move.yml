name: temp-title-first-move
on:
  push:
    branches: [main]
    paths: ['.title-first-move-trigger']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify mechanical Title first move
        env:
          URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: |
          set -euo pipefail
          title_first="$(curl --fail-with-body -sS "$URL" -H 'content-type: application/json' -H "apikey: $KEY" --data '{"action":"start_match","order":"gote","senteHandicap":"even","goteHandicap":"even"}')"
          echo "$title_first" | jq -e '
            .ok == true and
            .phase == "human_turn" and
            .humanSide == "gote" and
            .titleSide == "sente" and
            .position.ply == 1 and
            .position.turn == "gote" and
            (.title.nodes == 0) and
            (.title.computePathMs == 0) and
            (.title.move.from | length == 2) and
            (.title.move.to | length == 2) and
            (.title.move.from[0] == 6) and
            (.title.move.to[0] == 5) and
            (.title.move.from[1] == .title.move.to[1]) and
            (.position.board[6][.title.move.from[1]] == null) and
            (.position.board[5][.title.move.to[1]].side == "sente") and
            (.position.board[5][.title.move.to[1]].kind == "pawn")
          ' >/dev/null
          echo "TITLE_FIRST_OK:$(echo "$title_first" | jq -c '{phase,humanSide,titleSide,ply:.position.ply,turn:.position.turn,move:.title.move,moveCode:.title.moveCode,nodes:.title.nodes,computePathMs:.title.computePathMs}')"

          human_first="$(curl --fail-with-body -sS "$URL" -H 'content-type: application/json' -H "apikey: $KEY" --data '{"action":"start_match","order":"sente","senteHandicap":"even","goteHandicap":"even"}')"
          echo "$human_first" | jq -e '
            .ok == true and
            .phase == "human_turn" and
            .humanSide == "sente" and
            .titleSide == "gote" and
            .position.ply == 0 and
            .position.turn == "sente" and
            (.title == null)
          ' >/dev/null
          echo "HUMAN_FIRST_UNCHANGED_OK"
