name: temp-title-health
on:
  push:
    branches: [main]
    paths: ['.title-health-trigger']
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exercise authoritative Title round trip
        env:
          URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: |
          set -euo pipefail
          call(){ curl -sS -X POST "$URL" -H 'content-type: application/json' -H "apikey: $KEY" --data "$1"; }

          H="$(call '{"action":"health"}')"
          echo "HEALTH:$(jq -c '{ok,mode,githubConfigured}' <<<"$H")"
          test "$(jq -r '.githubConfigured' <<<"$H")" = true

          S="$(call '{"action":"start_match","order":"sente","senteHandicap":"even","goteHandicap":"even"}')"
          echo "START:$(jq -c '{ok,phase,turn:.position.turn,ply:.position.ply}' <<<"$S")"
          test "$(jq -r '.ok' <<<"$S")" = true
          test "$(jq -r '.phase' <<<"$S")" = human_turn
          TOKEN="$(jq -r '.stateToken' <<<"$S")"

          BODY="$(jq -nc --arg t "$TOKEN" '{action:"user_move",stateToken:$t,move:{from:[6,0],to:[5,0]}}')"
          M="$(call "$BODY")"
          echo "USER_MOVE:$(jq -c '{ok,phase,error,runId,requestId,turn:.position.turn,ply:.position.ply}' <<<"$M")"
          test "$(jq -r '.ok' <<<"$M")" = true
          test "$(jq -r '.phase' <<<"$M")" = cpu_pending
          RUN_ID="$(jq -r '.runId' <<<"$M")"
          REQUEST_ID="$(jq -r '.requestId' <<<"$M")"
          CPU_TOKEN="$(jq -r '.stateToken' <<<"$M")"
          test "$RUN_ID" != null
          test "$REQUEST_ID" != null

          for i in $(seq 1 120); do
            STATUS_BODY="$(jq -nc --arg t "$CPU_TOKEN" --arg r "$REQUEST_ID" --argjson id "$RUN_ID" '{action:"status",stateToken:$t,requestId:$r,runId:$id}')"
            R="$(call "$STATUS_BODY")"
            PHASE="$(jq -r '.phase // empty' <<<"$R")"
            if [ "$PHASE" = human_turn ] || [ "$PHASE" = ended ]; then
              echo "FINAL:$(jq -c '{ok,phase,turn:.position.turn,ply:.position.ply,outcome,title}' <<<"$R")"
              test "$(jq -r '.ok' <<<"$R")" = true
              test "$(jq -r '.position.ply' <<<"$R")" = 2
              test "$(jq -r '.position.turn' <<<"$R")" = sente
              jq -e '.title.moveCode|numbers' <<<"$R" >/dev/null
              echo TITLE_FULL_ROUNDTRIP_PASS
              exit 0
            fi
            if [ "$(jq -r '.ok' <<<"$R")" != true ]; then
              echo "STATUS_ERROR:$R" >&2
              exit 1
            fi
            sleep 5
          done
          echo TITLE_ROUNDTRIP_TIMEOUT >&2
          exit 1
