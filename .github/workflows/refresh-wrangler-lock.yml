name: Refresh Wrangler lock

on:
  push:
    branches:
      - fix/wrangler-4.131.2-lock
    paths:
      - .github/workflows/refresh-wrangler-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Refresh Wrangler dependency lock
        working-directory: cloudflare
        run: npm install --package-lock-only --save-dev --save-exact wrangler@4.131.2

      - name: Install locked dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Security audit
        working-directory: cloudflare
        run: npm audit --audit-level=high

      - name: Type check
        working-directory: cloudflare
        run: npm run check

      - name: Dry-run Worker build
        working-directory: cloudflare
        run: npm run build

      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/package.json cloudflare/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Update Wrangler to 4.131.2"
          git push origin HEAD:fix/wrangler-4.131.2-lock
