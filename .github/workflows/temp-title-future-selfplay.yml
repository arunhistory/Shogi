name: temp-title-vs-pro-one

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-future-selfplay.yml'

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Bound title GPU forecast and diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/title-gpu-forecast.ts')
          s=p.read_text()
          old='const SAMPLES_PER_LANE=3125;'
          if old not in s:
              raise SystemExit('TITLE_GPU_SAMPLE_ANCHOR_NOT_FOUND')
          p.write_text(s.replace(old,'const SAMPLES_PER_LANE=1;',1))

          p=Path('scripts/title-gpu-fabric-throughput.mjs')
          s=p.read_text()
          replacements={
            'result.samplesPerLane===3125':'result.samplesPerLane===1',
            'result.plannedSamples===100000000':'result.plannedSamples===32000',
            'result.totalSamples===100000000':'result.totalSamples===32000',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'GPU_DIAGNOSTIC_ANCHOR_NOT_FOUND:{old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build application
        run: npm run build
      - name: Diagnose title GPU
        run: node scripts/title-gpu-fabric-throughput.mjs
      - name: Run title GPU versus pro CPU as gote
        run: node scripts/title-selfplay-one.mjs 2
