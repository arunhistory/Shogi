name: temp-title-vs-pro-one

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-future-selfplay.yml'

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Run title GPU versus pro CPU as gote
        run: node scripts/title-selfplay-one.mjs 2
