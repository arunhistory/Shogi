name: temp-title-vs-pro-one

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-future-selfplay.yml'

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Disable WebGPU only for strength isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/title-selfplay-one.mjs')
          s=p.read_text()
          old="'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',"
          if old not in s:
              raise SystemExit('GPU_FLAGS_NOT_FOUND')
          p.write_text(s.replace(old,"'--disable-gpu',",1))
          PY
      - name: Run title versus pro as gote
        run: node scripts/title-selfplay-one.mjs 2
