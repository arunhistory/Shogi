name: temp-title-vs-pro-one

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-future-selfplay.yml'

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Isolate CPU and patch title A/B variant in runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/title-selfplay-one.mjs')
          s=p.read_text()
          old="'--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader',"
          if old not in s:
              raise SystemExit('GPU_FLAGS_NOT_FOUND')
          p.write_text(s.replace(old,"'--disable-gpu',",1))

          p=Path('src/game/cpu-worker.ts')
          s=p.read_text()
          old="profileCode:level==='title'?3:profile.profileCode,"
          if old not in s:
              raise SystemExit('TITLE_PROFILE_ANCHOR_NOT_FOUND')
          s=s.replace(old,"profileCode:profile.profileCode,",1)
          old="""    const ranked=rankStageResults(survivors,completed,level);\n    if(ranked.length){"""
          new="""    const ranked=rankStageResults(survivors,completed,level);\n    if(level==='title'&&(ranked.length!==survivors.length||ranked.some(item=>item.completeSamples===0)))break;\n    if(ranked.length){"""
          if old not in s:
              raise SystemExit('TITLE_STAGE_ANCHOR_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build A/B variant
        run: npm run build
      - name: Run complete-stage title versus pro as gote
        run: node scripts/title-selfplay-one.mjs 2
