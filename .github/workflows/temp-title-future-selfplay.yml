name: temp-title-vs-pro-one

on:
  push:
    branches:
      - 'temp/title-nwp-forecast'
    paths:
      - '.github/workflows/temp-title-future-selfplay.yml'

permissions:
  contents: read

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: temp/title-nwp-forecast
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - name: Install application dependencies
        run: npm ci
      - name: Patch WGSL reserved identifier for validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/title-gpu-forecast.ts')
          s=p.read_text()
          old='let target=select(ownKing,enemyKing,side==perspective);'
          if old not in s:
              raise SystemExit('WGSL_TARGET_ANCHOR_NOT_FOUND')
          s=s.replace(old,'let pressureTarget=select(ownKing,enemyKing,side==perspective);',1)
          s=s.replace('rowOf(target)','rowOf(pressureTarget)',1)
          s=s.replace('colOf(target)','colOf(pressureTarget)',1)
          p.write_text(s)
          PY
      - name: Build application
        run: npm run build
      - name: Diagnose title GPU frontier
        run: node scripts/title-gpu-fabric-throughput.mjs
      - name: Run title GPU versus pro CPU as gote
        run: node scripts/title-selfplay-one.mjs 2
