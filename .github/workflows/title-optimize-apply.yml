name: title-optimize-apply

on:
  push:
    branches: [optimize-title-cpu-speed]
    paths:
      - '.github/workflows/title-optimize-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: optimize-title-cpu-speed
          fetch-depth: 0

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Build baseline WebAssembly
        run: |
          sh scripts/build-wasm.sh
          cp public/wasm/shogi_engine.wasm /tmp/title-before.wasm

      - name: Apply title-only evaluation deduplication
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('cpp/engine_parallel.cpp')
          source = path.read_text()

          marker = '''int mating_pressure_score(const Position& pos, int attacker_side) {
'''
          helper = '''struct TitleSideMetrics {
  int king_safety = -kMateScore / 2;
  int king_net = kMateScore / 2;
  int exposure = 100;
};

TitleSideMetrics title_side_metrics(const Position& pos, int defender_side) {
  TitleSideMetrics metrics;
  const int king = king_square_for_side(pos, defender_side);
  if (king < 0) return metrics;

  const int ky = row_of(king), kx = col_of(king);
  int shield = 0;
  int danger = 0;
  int attacked_ring = 0;
  int attack_contacts = 0;
  int escape_like = 0;

  for (int dy = -1; dy <= 1; ++dy) {
    for (int dx = -1; dx <= 1; ++dx) {
      if (dy == 0 && dx == 0) continue;
      const int y = ky + dy, x = kx + dx;
      if (!inside(y, x)) continue;
      const int target = square_of(y, x);
      const int occupant = pos.board[target];
      const int contacts = attack_count_on_square(pos, -defender_side, target);
      danger += contacts;
      if (contacts > 0) ++attacked_ring;
      attack_contacts += contacts > 3 ? 3 : contacts;
      if (contacts == 0 && sign_of(occupant) != defender_side) ++escape_like;
      if (sign_of(occupant) == defender_side) {
        const int kind = kind_of(occupant);
        if (kind == 5 || kind == 9 || kind == 10 || kind == 11 || kind == 12) shield += 3;
        else if (kind == 4) shield += 2;
        else if (kind != 8) shield += 1;
      }
    }
  }

  const bool home_rank = defender_side == 1 ? ky >= 7 : ky <= 1;
  const int edge_distance = abs_i(kx - 4);
  metrics.king_safety = shield * 8 + (home_rank ? 18 : 0) + edge_distance * 4 - danger * 13;
  metrics.king_net = attacked_ring * 55 + attack_contacts * 14 - escape_like * 45 - shield * 12;
  if (is_check(pos, defender_side)) metrics.king_net += 420;

  int exposure = 0;
  for (int square = 0; square < kBoardSquares; ++square) {
    const int code = pos.board[square];
    if (sign_of(code) != defender_side) continue;
    const int kind = kind_of(code);
    if (kind == 8 || kind == 1) continue;
    const int y = row_of(square), x = col_of(square);
    const int progress = defender_side == 1 ? 8 - y : y;
    const int distance = abs_i(y - ky) + abs_i(x - kx);
    if (progress < 4 || distance < 3) continue;
    int weight = 2;
    if (kind == 7 || kind == 14) weight = 5;
    else if (kind == 6 || kind == 13) weight = 4;
    else if (kind == 4 || kind == 5 || kind == 9 || kind == 10 || kind == 11 || kind == 12) weight = 3;
    exposure += (progress - 3) * weight + (distance > 3 ? distance - 3 : 0);
  }
  metrics.exposure = exposure;
  return metrics;
}

int title_strategic_side_score(const Position& pos, int side, const TitleSideMetrics& metrics) {
  return metrics.king_safety
    + major_activity(pos, side) * 4
    + hand_initiative(pos, side) * 3 / 4
    + promoted_invasion(pos, side) * 2;
}

'''
          if source.count(marker) != 1:
            raise SystemExit('title helper insertion marker mismatch')
          source = source.replace(marker, helper + marker, 1)

          old = '''int parallel_evaluate_for(const Position& pos, int perspective) {
  const int base = evaluate_for(pos, perspective);
  if (g_parallel_profile <= 1) return base;
  const int strategic = strategic_side_score(pos, perspective) - strategic_side_score(pos, -perspective);
  if (g_parallel_profile == 2) return base + strategic;
  const int mating = mating_pressure_score(pos, perspective) - mating_pressure_score(pos, -perspective);
  if (g_parallel_profile == 3) return base + strategic / 2 + mating * 3 / 2;
  return base + strategic / 3 + mating * 2;
}
'''
          new = '''int parallel_evaluate_for(const Position& pos, int perspective) {
  const int base = evaluate_for(pos, perspective);
  if (g_parallel_profile <= 1) return base;
  if (g_parallel_profile >= 4) {
    const TitleSideMetrics own = title_side_metrics(pos, perspective);
    const TitleSideMetrics opponent = title_side_metrics(pos, -perspective);
    const int strategic = title_strategic_side_score(pos, perspective, own)
      - title_strategic_side_score(pos, -perspective, opponent);
    const int mating = (opponent.king_net + opponent.exposure * 6)
      - (own.king_net + own.exposure * 6);
    return base + strategic / 3 + mating * 2;
  }
  const int strategic = strategic_side_score(pos, perspective) - strategic_side_score(pos, -perspective);
  if (g_parallel_profile == 2) return base + strategic;
  const int mating = mating_pressure_score(pos, perspective) - mating_pressure_score(pos, -perspective);
  return base + strategic / 2 + mating * 3 / 2;
}
'''
          if source.count(old) != 1:
            raise SystemExit('parallel evaluator replacement mismatch')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Build optimized WebAssembly
        run: |
          sh scripts/build-wasm.sh
          cp public/wasm/shogi_engine.wasm /tmp/title-after.wasm

      - name: Verify WebAssembly runtime
        run: node scripts/test-wasm.mjs

      - name: Compare fixed title search scores and runtime
        run: |
          cat > /tmp/title-bench.mjs <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {performance} from 'node:perf_hooks';

          const MAGIC=0x53484749, WORDS=97, HISTORY_MAGIC=0x48535431, HISTORY_ENTRY_WORDS=5;
          const FNV_PRIME=1099511628211n, FNV_PRIMARY_SEED=1469598103934665603n, FNV_SECONDARY_SEED=0x84222325cbf29ce4n, MASK_64=(1n<<64n)-1n;
          const initialBoard=()=>{const b=new Int32Array(81),back=[2,3,4,5,8,5,4,3,2];for(let x=0;x<9;x++){b[x]=-back[x];b[18+x]=-1;b[54+x]=1;b[72+x]=back[x];}b[10]=-7;b[16]=-6;b[64]=6;b[70]=7;return b;};
          const mix=(h,v)=>((h^BigInt(v&0xff))*FNV_PRIME)&MASK_64;
          const hash=(state,seed)=>{let h=seed;for(const v of state.board)h=mix(h,v+16);for(const v of state.hands)h=mix(h,v);return mix(h,state.turn===1?1:2);};
          const split=v=>[Number(BigInt.asIntN(32,v&0xffffffffn)),Number(BigInt.asIntN(32,(v>>32n)&0xffffffffn))];

          async function load(path){const {instance}=await WebAssembly.instantiate(await readFile(path),{});return instance.exports;}
          function prepare(wasm,state){
            const input=new Int32Array(wasm.memory.buffer,wasm.shogi_input_buffer(),wasm.shogi_input_capacity());
            const words=new Int32Array(WORDS);words[0]=MAGIC;words[1]=state.turn;words.set(state.board,2);words.set(state.hands,83);input.fill(0,0,WORDS);input.set(words);
            const hist=new Int32Array(wasm.memory.buffer,wasm.shogi_history_buffer(),wasm.shogi_history_capacity());
            const [pl,ph]=split(hash(state,FNV_PRIMARY_SEED)),[sl,sh]=split(hash(state,FNV_SECONDARY_SEED));
            hist.fill(0,0,2+HISTORY_ENTRY_WORDS);hist[0]=HISTORY_MAGIC;hist[1]=1;hist[2]=pl;hist[3]=ph;hist[4]=sl;hist[5]=sh;hist[6]=0;
            return 2+HISTORY_ENTRY_WORDS;
          }
          function run(wasm,state){
            const hw=prepare(wasm,state);const count=wasm.shogi_legal_move_count(WORDS);assert.ok(count>0);
            const moves=Array.from({length:Math.min(8,count)},(_,i)=>wasm.shogi_legal_move_at(i));
            const started=performance.now();
            const scores=moves.map((move,i)=>wasm.shogi_search_root_move_with_history(WORDS,hw,move,7,120000,i%5,4));
            return {scores,ms:performance.now()-started};
          }
          const state={turn:1,board:initialBoard(),hands:new Int32Array(14)};
          const before=run(await load('/tmp/title-before.wasm'),state);
          const after=run(await load('/tmp/title-after.wasm'),state);
          assert.deepEqual(after.scores,before.scores,'title score regression');
          console.log(JSON.stringify({titleScoreParity:true,beforeMs:before.ms,afterMs:after.ms,speedup:before.ms/after.ms,scores:after.scores}));
          JS
          node /tmp/title-bench.mjs

      - name: Commit verified source optimization to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpp/engine_parallel.cpp
          git diff --cached --check
          git commit -m "Optimize title CPU evaluation without score changes"
          git push origin HEAD:optimize-title-cpu-speed
