name: title-supercomputer-drop-fast-benchmark

on:
  push:
    branches:
      - 'experiment/title-supercomputer-v1'
    paths:
      - 'scripts/temp-patch-title-super-drop-fast.mjs'
      - 'scripts/title-supercomputer-compare-exact.mjs'
      - '.github/workflows/title-supercomputer-drop-fast-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/title-supercomputer-v1
      - name: Install Emscripten toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten wabt binaryen
      - name: Reconstruct current 42KB-class baseline and exact candidate
        run: |
          node scripts/temp-patch-title-super-fastpath.mjs cpp/title_supercomputer.cpp /tmp/super-fast.cpp
          node scripts/temp-patch-title-super-metrics.mjs /tmp/super-fast.cpp /tmp/super-metrics.cpp
          node scripts/temp-patch-title-super-inplace.mjs /tmp/super-metrics.cpp /tmp/super-baseline.cpp
          node scripts/temp-patch-title-super-drop-fast.mjs /tmp/super-baseline.cpp /tmp/super-candidate.cpp
      - name: Build baseline and candidate WASM identically
        run: |
          FLAGS=(
            -Icpp -O3 -std=c++17 -include initializer_list
            -s WASM=1 -s STANDALONE_WASM=1 --no-entry
            -Wl,--export=shogi_input_buffer
            -Wl,--export=shogi_input_capacity
            -Wl,--export=shogi_legal_move_count
            -Wl,--export=shogi_legal_move_at
            -Wl,--export=shogi_is_check
            -Wl,--export=shogi_is_mate
            -Wl,--export=shogi_super_search_specialist
            -Wl,--export=shogi_super_converge
            -Wl,--export=shogi_super_best_score
            -Wl,--export=shogi_super_nodes_searched
            -Wl,--export=shogi_super_inplace_selftest
          )
          em++ /tmp/super-baseline.cpp "${FLAGS[@]}" -o /tmp/baseline.raw.wasm
          em++ /tmp/super-candidate.cpp "${FLAGS[@]}" -o /tmp/candidate.raw.wasm
          wasm-opt -O4 /tmp/baseline.raw.wasm -o /tmp/baseline.wasm
          wasm-opt -O4 /tmp/candidate.raw.wasm -o /tmp/candidate.wasm
          wasm-validate /tmp/baseline.wasm
          wasm-validate /tmp/candidate.wasm
          sha256sum /tmp/baseline.wasm /tmp/candidate.wasm
          stat -c '%n %s' /tmp/baseline.wasm /tmp/candidate.wasm
      - name: Compare exact 5M behavior and speed
        run: |
          for s in 1 7 8 9 10 18 19 20; do
            echo "=== specialist $s ==="
            TITLE_SUPER_SPECIALIST=$s node scripts/title-supercomputer-compare-exact.mjs /tmp/baseline.wasm /tmp/candidate.wasm
          done
