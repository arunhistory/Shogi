name: temp-title-gpu-selfplay-one
on:
  push:
    branches:
      - temp/title-nwp-forecast
    paths:
      - 'src/game/**'
      - 'cpp/**'
      - 'scripts/build-wasm.sh'
      - 'scripts/title-selfplay-one.mjs'
      - '.github/workflows/temp-title-gpu-selfplay-one.yml'
  workflow_dispatch:

jobs:
  selfplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch verified build cache
        run: git fetch origin build-output:refs/remotes/origin/build-output --depth=1 || true
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Build WebAssembly engine
        run: sh scripts/build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install application dependencies
        run: npm ci
      - name: Run one GPU-assisted title versus pro game
        run: node scripts/title-selfplay-one.mjs 1
