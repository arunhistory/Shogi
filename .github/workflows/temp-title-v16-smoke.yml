name: temp-title-v16-smoke
on:
  push:
    branches: [main]
    paths: ['.title-v16-smoke-trigger']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify authoritative DB Title flow
        env:
          URL: https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/title-supercomputer
          KEY: sb_publishable_POCxau9QCPFlF0J11o-ZFg_-QY4b8gF
        run: |
          set -euo pipefail
          call(){ curl -sS -X POST "$URL" -H 'content-type: application/json' -H "apikey: $KEY" --data "$1"; }
          H="$(call '{"action":"health"}')"
          echo "HEALTH:$(jq -c '{ok,mode,githubConfigured}' <<<"$H")"
          test "$(jq -r '.ok' <<<"$H")" = true
          test "$(jq -r '.mode' <<<"$H")" = authoritative-db-game-controller
          test "$(jq -r '.githubConfigured' <<<"$H")" = true

          S="$(call '{"action":"start_match","order":"sente","senteHandicap":"even","goteHandicap":"even"}')"
          echo "START:$(jq -c '{ok,phase,gameId,turn:.position.turn,ply:.position.ply}' <<<"$S")"
          test "$(jq -r '.phase' <<<"$S")" = human_turn
          ID="$(jq -r '.gameId' <<<"$S")"
          TOKEN="$(jq -r '.stateToken' <<<"$S")"

          M1_BODY="$(jq -nc --arg id "$ID" --arg t "$TOKEN" '{action:"user_move",gameId:$id,stateToken:$t,move:{from:[6,0],to:[5,0]}}')"
          M1="$(call "$M1_BODY")"
          echo "MOVE1:$(jq -c '{ok,phase,turn:.position.turn,ply:.position.ply}' <<<"$M1")"
          test "$(jq -r '.ok' <<<"$M1")" = true
          test "$(jq -r '.phase' <<<"$M1")" = cpu_pending
          test "$(jq -r '.position.ply' <<<"$M1")" = 1

          TMP="$(mktemp)"
          FORK_BODY="$(jq -nc --arg id "$ID" --arg t "$TOKEN" '{action:"user_move",gameId:$id,stateToken:$t,move:{from:[6,1],to:[5,1]}}')"
          FORK_CODE="$(curl -sS -o "$TMP" -w '%{http_code}' -X POST "$URL" -H 'content-type: application/json' -H "apikey: $KEY" --data "$FORK_BODY")"
          FORK="$(cat "$TMP")"
          echo "FORK:$FORK_CODE:$(jq -c '{ok,error}' <<<"$FORK")"
          test "$FORK_CODE" = 409
          test "$(jq -r '.ok' <<<"$FORK")" = false

          for i in $(seq 1 150); do
            B="$(jq -nc --arg id "$ID" --arg t "$TOKEN" '{action:"status",gameId:$id,stateToken:$t}')"
            R="$(call "$B")"
            P="$(jq -r '.phase // empty' <<<"$R")"
            if [ "$P" = human_turn ] || [ "$P" = ended ]; then
              echo "CPU_FINAL:$(jq -c '{ok,phase,turn:.position.turn,ply:.position.ply,title}' <<<"$R")"
              test "$(jq -r '.ok' <<<"$R")" = true
              test "$(jq -r '.position.ply' <<<"$R")" = 2
              test "$(jq -r '.position.turn' <<<"$R")" = sente
              jq -e '.title.moveCode|numbers' <<<"$R" >/dev/null
              break
            fi
            test "$(jq -r '.ok' <<<"$R")" = true
            sleep 5
            if [ "$i" = 150 ]; then echo CPU_TIMEOUT >&2; exit 1; fi
          done

          S2="$(call '{"action":"start_match","order":"sente","senteHandicap":"even","goteHandicap":"even"}')"
          ID2="$(jq -r '.gameId' <<<"$S2")"; T2="$(jq -r '.stateToken' <<<"$S2")"
          RB="$(jq -nc --arg id "$ID2" --arg t "$T2" '{action:"resign",gameId:$id,stateToken:$t}')"
          RR="$(call "$RB")"
          echo "RESIGN:$(jq -c '{ok,phase,outcome}' <<<"$RR")"
          test "$(jq -r '.phase' <<<"$RR")" = ended
          test "$(jq -r '.outcome.reason' <<<"$RR")" = resignation
          echo TITLE_V16_SMOKE_PASS
